<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Chat</h1>
    <button id="new-chat" class="ghost-btn" type="button" title="Start a new conversation">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>New chat</span>
    </button>
  </header>

  <main id="thread" class="thread" aria-live="polite">
    <div id="empty" class="empty">
      <h2>How can I help you today?</h2>
      <p>Type a message below to start a conversation.</p>
    </div>
  </main>

  <form id="composer" class="composer" autocomplete="off">
    <div class="composer-box">
      <textarea id="input" rows="1" placeholder="Type a message…" aria-label="Message"></textarea>
      <button id="send" class="send-btn" type="submit" title="Send" aria-label="Send">
        <svg class="icon-send" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="icon-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
      </button>
    </div>
    <p class="hint">Enter to send · Shift + Enter for a new line</p>
  </form>

  <script src="/app.js"></script>
</body>
</html>
